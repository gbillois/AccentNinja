<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Night sky gradient: deep indigo → midnight purple → near-black -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1a1648"/>
      <stop offset="0.45" stop-color="#221a5c"/>
      <stop offset="0.75" stop-color="#140a38"/>
      <stop offset="1"    stop-color="#06021a"/>
    </linearGradient>

    <!-- Moon halo -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff3c8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffe39a" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Mount Fuji -->
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a66"/>
      <stop offset="1" stop-color="#180a3a"/>
    </linearGradient>

    <!-- Red brush swash behind the title -->
    <radialGradient id="brushSwash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#120610" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#0a0210" stop-opacity="0.6"/>
      <stop offset="1"    stop-color="#0a0210" stop-opacity="0"/>
    </radialGradient>

    <!-- Red gradient for the "NINJA" word -->
    <linearGradient id="bloodRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#c80f2a"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="820" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="28"  cy="60"  r="0.9" opacity="0.8"/>
    <circle cx="72"  cy="110" r="1.2" opacity="0.9"/>
    <circle cx="140" cy="38"  r="0.8" opacity="0.7"/>
    <circle cx="205" cy="82"  r="1"   opacity="0.85"/>
    <circle cx="248" cy="28"  r="1.1" opacity="0.9"/>
    <circle cx="358" cy="182" r="0.8" opacity="0.7"/>
    <circle cx="118" cy="198" r="0.9" opacity="0.8"/>
    <circle cx="54"  cy="230" r="1"   opacity="0.75"/>
    <circle cx="182" cy="142" r="0.7" opacity="0.6"/>
    <circle cx="376" cy="78"  r="0.9" opacity="0.8"/>
    <circle cx="90"  cy="330" r="0.7" opacity="0.55"/>
    <circle cx="300" cy="240" r="0.8" opacity="0.6"/>
  </g>

  <!-- Moon with glow halo -->
  <circle cx="320" cy="102" r="70" fill="url(#moonGlow)"/>
  <circle cx="320" cy="102" r="34" fill="#fbf1cd"/>
  <circle cx="308" cy="92"  r="4.5" fill="#e6dcae" opacity="0.55"/>
  <circle cx="332" cy="114" r="3.2" fill="#e6dcae" opacity="0.5"/>
  <circle cx="338" cy="86"  r="2.2" fill="#e6dcae" opacity="0.45"/>

  <!-- Clouds -->
  <g fill="#0a041a" opacity="0.7">
    <ellipse cx="90"  cy="186" rx="62" ry="7"/>
    <ellipse cx="280" cy="158" rx="48" ry="5"/>
    <ellipse cx="200" cy="288" rx="95" ry="9"/>
  </g>

  <!-- Mount Fuji -->
  <path d="M30 500 L168 322 Q180 310 192 322 L330 500 Z" fill="url(#fuji)"/>
  <!-- Fuji snow cap -->
  <path d="M138 368 L168 322 Q180 310 192 322 L222 368 L205 378 L188 362 L172 378 L155 360 Z"
        fill="#e9ecff" opacity="0.78"/>

  <!-- Red brush swash behind title (distressed circle) -->
  <g opacity="0.9">
    <ellipse cx="200" cy="248" rx="160" ry="110" fill="url(#brushSwash)"/>
    <path d="M70 248 Q90 140 200 130 Q320 135 335 240 Q335 345 210 360 Q90 355 70 248 Z"
          fill="none" stroke="#0a0012" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M82 225 Q105 155 200 148"
          fill="none" stroke="#0a0012" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Title: ACCENT (white) -->
  <g font-family="'Dela Gothic One', 'Noto Sans', sans-serif" font-weight="900" text-anchor="middle">
    <text x="198" y="238" font-size="58" fill="#ffffff"
          stroke="#120610" stroke-width="3" paint-order="stroke fill"
          filter="url(#softGlow)">ACCENT</text>
    <!-- Title: NINJA (red) -->
    <text x="204" y="300" font-size="58" fill="url(#bloodRed)"
          stroke="#120610" stroke-width="3" paint-order="stroke fill"
          filter="url(#softGlow)">NINJA</text>
  </g>

  <!-- Sword-slash underline under title -->
  <g>
    <path d="M90 330 Q200 322 318 334" fill="none"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M96 336 Q200 330 312 340" fill="none"
          stroke="#e8274f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tagline -->
  <text x="200" y="360" font-family="'Noto Sans', sans-serif" font-weight="700"
        font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="3">SPEAK AND SLASH</text>

  <!-- Cherry-blossom branch (top-left) -->
  <g stroke="#1a0810" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M-6 12 Q40 28 92 52"/>
    <path d="M22 22 Q34 10 52 14"/>
    <path d="M60 38 Q78 28 96 34"/>
  </g>
  <g fill="#f5a8c8">
    <circle cx="8"  cy="10" r="4.5"/>
    <circle cx="26" cy="6"  r="3.5"/>
    <circle cx="46" cy="14" r="4"/>
    <circle cx="64" cy="26" r="3.5"/>
    <circle cx="84" cy="44" r="4.5"/>
    <circle cx="100" cy="38" r="3"/>
  </g>
  <g fill="#ffd1e3" opacity="0.9">
    <circle cx="8"  cy="10" r="2"/>
    <circle cx="46" cy="14" r="1.8"/>
    <circle cx="84" cy="44" r="2"/>
  </g>

  <!-- Small cherry branch top-right -->
  <g stroke="#1a0810" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M410 24 Q380 36 340 50"/>
  </g>
  <g fill="#f5a8c8">
    <circle cx="348" cy="48" r="3.5"/>
    <circle cx="368" cy="38" r="3"/>
    <circle cx="388" cy="30" r="3"/>
  </g>

  <!-- Floating sakura petals -->
  <g fill="#f5a8c8" opacity="0.75">
    <ellipse cx="78"  cy="170" rx="3"   ry="5"   transform="rotate(30 78 170)"/>
    <ellipse cx="152" cy="340" rx="3"   ry="5"   transform="rotate(-20 152 340)"/>
    <ellipse cx="342" cy="298" rx="2.5" ry="4"   transform="rotate(45 342 298)"/>
    <ellipse cx="52"  cy="408" rx="2.5" ry="4"   transform="rotate(-15 52 408)"/>
    <ellipse cx="252" cy="148" rx="3"   ry="5"   transform="rotate(60 252 148)"/>
    <ellipse cx="112" cy="270" rx="2"   ry="3.2" transform="rotate(-40 112 270)"/>
  </g>

  <!-- Pagoda (right) -->
  <g transform="translate(282 408)">
    <polygon points="-12,80 52,80 42,62 -2,62" fill="#3a2050"/>
    <rect x="2" y="80" width="38" height="64" fill="#1a0f2e"/>
    <polygon points="-8,62 48,62 38,44 2,44" fill="#2e1846"/>
    <polygon points="-4,44 44,44 36,28 4,28" fill="#3a2050"/>
    <polygon points="0,28 40,28 32,14 8,14" fill="#4a2860"/>
    <!-- Lit windows -->
    <rect x="8"  y="92"  width="8" height="12" fill="#ffa84a"/>
    <rect x="24" y="92"  width="8" height="12" fill="#ffa84a"/>
    <rect x="8"  y="116" width="8" height="12" fill="#ffc166"/>
    <rect x="24" y="116" width="8" height="12" fill="#ffc166"/>
  </g>

  <!-- Pagoda (left, smaller) -->
  <g transform="translate(34 446)">
    <rect x="0" y="62" width="32" height="54" fill="#180d2a"/>
    <polygon points="-6,62 38,62 32,46 0,46" fill="#2a1844"/>
    <polygon points="-3,46 35,46 30,32 2,32" fill="#3a2050"/>
    <rect x="5"  y="76" width="6" height="10" fill="#ff9a3c"/>
    <rect x="21" y="76" width="6" height="10" fill="#ff9a3c"/>
  </g>

  <!-- Roof skyline foreground -->
  <polygon points="0,556 40,536 104,560 180,528 258,554 342,542 400,560 400,620 0,620"
           fill="#07030f"/>

  <!-- Ninja silhouette standing on roof -->
  <g transform="translate(172 490)">
    <!-- Body -->
    <path d="M-16 22 Q-22 56 -14 96 L-10 100 L-4 100 L0 88 L4 88 L8 100 L14 100 L18 96 Q24 56 14 22 Q8 16 0 16 Q-10 16 -16 22 Z"
          fill="#07020e"/>
    <!-- Head -->
    <circle cx="0" cy="-2" r="13" fill="#07020e"/>
    <!-- Red eye band -->
    <rect x="-13" y="-6" width="26" height="5" fill="#d41e3a"/>
    <rect x="-11" y="-4.5" width="22" height="1.3" fill="#ffffff"/>
    <!-- Headband trailing -->
    <path d="M12 -6 Q30 -4 42 -20 Q34 -2 26 6 Z" fill="#d41e3a"/>
    <!-- Red sash -->
    <rect x="-17" y="38" width="34" height="6" fill="#d41e3a"/>
    <!-- Katana held outward -->
    <g transform="rotate(-18 12 10)">
      <rect x="12" y="10" width="3.5" height="10" fill="#5c3a1e"/>
      <rect x="12.5" y="-48" width="3" height="58" fill="#eef2ff"/>
      <rect x="12.5" y="-48" width="3" height="58" fill="#ffffff" opacity="0.35"/>
    </g>
    <!-- Scabbard on back -->
    <rect x="16" y="24" width="3" height="36" fill="#2a1840"/>
  </g>

  <!-- Slashing sword streak across fruit -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="750" x2="380" y2="660" stroke-width="3"/>
    <line x1="130" y1="762" x2="378" y2="672" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- Sliced watermelon -->
  <g transform="translate(322 694)">
    <path d="M-22 0 Q-24 -16 -6 -20 Q12 -21 20 -6 Z" fill="#e74c3c"/>
    <path d="M-22 0 Q-24 -16 -6 -20 Q12 -21 20 -6"
          fill="none" stroke="#27ae60" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-10" cy="-10" r="0.9" fill="#2a0a0a"/>
    <circle cx="-2"  cy="-13" r="0.9" fill="#2a0a0a"/>
    <circle cx="8"   cy="-9"  r="0.9" fill="#2a0a0a"/>
  </g>

  <!-- Orange -->
  <g transform="translate(258 712)">
    <circle r="14" fill="#e67e22"/>
    <circle r="11" fill="#f39c12"/>
    <circle cx="-3" cy="-3" r="3" fill="#ffbe5c" opacity="0.7"/>
  </g>

  <!-- Green apple -->
  <g transform="translate(200 692)">
    <circle r="14" fill="#27ae60"/>
    <circle cx="-4" cy="-4" r="3" fill="#6fcf8c" opacity="0.7"/>
    <path d="M0 -14 Q3 -18 6 -14" fill="none" stroke="#1a0810" stroke-width="2"/>
  </g>

  <!-- Splatter/juice drops -->
  <g fill="#e74c3c" opacity="0.8">
    <circle cx="300" cy="760" r="2"/>
    <circle cx="310" cy="770" r="1.5"/>
    <circle cx="240" cy="770" r="1.5"/>
  </g>
</svg>
